# Site wide settings. Edit freely; rebuild with `cargo run --release -- build`.
name = "Daniel E. Mosquera P."
title = "Exposure Photography Festival Sub. | Daniel E. Mosquera P."
tagline = "How familiar places change with the seasons"
base_url = "https://eduardopava11.github.io/portfolio/"
# Uncomment to show contact details in the footer.
# email = "you@example.com"
# instagram = "yourhandle"

# Where the photographs are, relative to content/.
photos_dir = "Exposure Photography Festival"
# Last name used in submission file names (01_LastName.jpeg).
last_name = "Mosquera"
# The matte CLI (github.com/... ~/MATTE) that chooses and draws the borders.
matte_bin = "/Users/daniel/MATTE/target/release/matte"
# Show the framed copies on the site (content/framed/, made by `portfolio frame`).
framed = true

# Type. Run `portfolio fonts`, open analysis/fonts/index.html, pick, paste here.
font_family = "'IBM Plex Sans', system-ui, sans-serif"
font_css = "https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
# Title of the body of work. Shown on the opening screen when set.
series_title = "Exposure Photography Festival Sub."
